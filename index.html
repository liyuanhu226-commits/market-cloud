<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1017">
<meta name="format-detection" content="telephone=no">
<title>A股大盘云图 · 板块涨跌与主力资金</title>
<style>
:root{--bg:#0d1017;--panel:#151a23;--line:#262d3a;--text:#e6e9ef;--sub:#8b93a5;--up:#f0414c;--down:#16b35f;--flat:#8b93a5;--accent:#f5b83d;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","Helvetica Neue",Arial,sans-serif;font-size:13px}
body{display:flex;flex-direction:column;min-height:640px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
header{display:flex;align-items:center;gap:18px;padding:10px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#141925,#0f131b)}
.brand h1{margin:0;font-size:20px;letter-spacing:1px;white-space:nowrap}
.brand .sub{color:var(--sub);font-size:12px;white-space:nowrap}
.indices{display:flex;gap:8px;flex:1;overflow:hidden}
.idx{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:118px}
.idx .n{color:var(--sub);font-size:12px}
.idx .p{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.idx .c{font-size:12px;font-variant-numeric:tabular-nums}
.meta{text-align:right;line-height:1.6;white-space:nowrap;font-size:12px;color:var(--sub)}
.badge{display:inline-block;padding:1px 10px;border-radius:10px;font-size:12px;font-weight:600;background:#333a48;color:#cfd5e1}
.badge.trading{background:rgba(240,65,76,.18);color:#ff6b74;border:1px solid rgba(240,65,76,.5)}
.badge.closed{background:#2a303c;color:#aab2c3;border:1px solid #3a4252}
.badge.pre{background:rgba(245,184,61,.15);color:var(--accent);border:1px solid rgba(245,184,61,.45)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:transparent;color:var(--sub);border:0;padding:5px 10px;cursor:pointer;font-size:13px;font-family:inherit}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:#2b3446;color:#fff;font-weight:600}
.toolbar label{color:var(--sub);display:inline-flex;align-items:center;gap:5px}
select,button.btn{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px;font-family:inherit;cursor:pointer}
button.btn:hover,.seg button:hover{color:#fff}
button.btn.primary{border-color:#3d5a8a;background:#1c2a44}
.spacer{flex:1}
#countdown{color:var(--sub);font-variant-numeric:tabular-nums;min-width:84px;text-align:right;font-size:12px}
main{flex:1;display:flex;gap:10px;padding:10px 16px 6px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;position:relative}
.panel.map{flex:1;min-width:0}
.panel.side{width:360px;flex:none}
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.ptitle .hint{color:var(--sub);font-weight:400;font-size:12px;overflow:hidden;text-overflow:ellipsis}
.crumb a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
button.btn.back{border-color:#7a5a1e;background:rgba(245,184,61,.14);color:var(--accent);font-weight:700;padding:2px 10px;margin-right:6px}
button,select{touch-action:manipulation}
.selbar{display:none;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--line);font-size:13px}
.selbar .info{flex:1;min-width:0;line-height:1.5}
.selbar .info b{font-size:14px}
.selbar .btn{white-space:nowrap}
.lt{white-space:nowrap}
#treemap{flex:1;min-height:0}
#bar{flex:1;min-height:0}
#summary{border-top:1px solid var(--line);padding:8px 12px;line-height:1.75;font-size:12px;color:var(--sub)}
#summary b{color:var(--text);font-weight:600}
.legend{display:inline-flex;align-items:center;gap:6px;font-weight:400;font-size:11px;color:var(--sub)}
.legend .bar{width:180px;height:10px;border-radius:3px}
.overlay{position:absolute;inset:40px 0 0 0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px;pointer-events:none;text-align:center;padding:20px;line-height:1.8}
footer{padding:4px 16px 8px;color:#697186;font-size:11px;display:flex;justify-content:space-between;gap:12px}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#3a2226;color:#ffb3b8;border:1px solid #7a3a42;padding:8px 14px;border-radius:8px;font-size:13px;display:none;z-index:99;max-width:80vw}
.tt{font-size:12px;line-height:1.7;min-width:210px}
.tt .h{font-size:14px;font-weight:700;margin-bottom:2px}
.tt .r{display:flex;justify-content:space-between;gap:18px}
.tt .k{color:#9aa3b5}
.tt .v{font-variant-numeric:tabular-nums;font-weight:600}
.tt hr{border:0;border-top:1px solid #333b4a;margin:4px 0}
@media (max-width:1100px){.panel.side{width:300px}.idx{min-width:100px}}
/* ===== 手机竖屏 / 窄屏 ===== */
@media (max-width:760px){
  html,body{height:auto;overflow-x:hidden;font-size:14px}
  body{min-height:0;display:block;padding-bottom:env(safe-area-inset-bottom)}
  header{flex-wrap:wrap;gap:6px 10px;padding:8px 12px 8px}
  .brand{flex:1 1 100%;min-width:0;display:flex;align-items:baseline;gap:8px}
  .brand h1{font-size:18px}
  .brand .sub{font-size:11px}
  .meta{order:3;flex:1 1 100%;font-size:11px;line-height:1.5;white-space:normal;min-width:0;text-align:left;display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px}
  .meta .badge{font-size:11px;padding:0 8px}
  .indices{order:2;flex:1 1 100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:6px;padding-bottom:2px}
  .indices::-webkit-scrollbar{display:none}
  .idx{flex:0 0 auto;min-width:100px;scroll-snap-align:start;padding:4px 9px}
  .idx .n{font-size:11px}
  .idx .p{font-size:15px}
  .idx .c{font-size:11px}
  .toolbar{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;padding:8px 12px;align-items:end}
  .toolbar .seg{grid-column:1/-1;display:flex;width:100%}
  .seg button{flex:1 1 0;min-height:38px;padding:0 2px;font-size:13px}
  .toolbar label{display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:0}
  .toolbar label .lt{font-size:11px;line-height:1.2}
  select,button.btn{min-height:38px;font-size:14px;padding:4px 6px;width:100%;min-width:0}
  #btnRefresh{width:auto;padding:4px 12px}
  .spacer{display:none}
  #gnOpts{grid-column:1/-1;gap:10px;align-items:end}
  #gnOpts label{flex:1 1 0}
  #gnOpts label.chk{flex-direction:row;align-items:center;min-height:38px;font-size:13px}
  #gnOpts label.chk input{width:20px;height:20px}
  .toolbar > label, #btnRefresh{order:1}
  #gnOpts{order:3}
  #countdown{order:4;grid-column:1/-1;min-width:0;text-align:left;font-size:11px;line-height:1.2;margin-top:-2px}
  main{display:flex;flex-direction:column;gap:10px;padding:8px 8px 6px}
  .panel.map{flex:none;height:66vh;min-height:360px}
  .panel.side{width:auto}
  #bar{flex:none;height:540px}
  .ptitle{flex-wrap:wrap;white-space:normal;padding:7px 10px;row-gap:4px}
  .ptitle .hint{font-size:11px;white-space:normal;order:3;flex:1 1 100%}
  .legend .bar{width:110px}
  button.btn.back{min-height:36px;width:auto;font-size:14px;padding:4px 12px}
  .selbar{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:10000001;background:rgba(27,33,48,.97);border:1px solid #3a4458;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.6);padding:8px 10px}
  .selbar .btn{min-height:40px;width:auto;padding:4px 12px}
  #summary{font-size:12.5px}
  footer{flex-direction:column;gap:4px;padding:6px 12px 14px}
  #toast{max-width:92vw;font-size:12.5px}
  .tt{min-width:0;font-size:12px}
}
</style>

<body>
<header>
  <div class="brand"><h1>A股大盘云图</h1><div class="sub">板块涨跌 · 主力资金流向</div></div>
  <div id="indices" class="indices"></div>
  <div class="meta">
    <div>市场状态 <span id="mktStatus" class="badge">--</span></div>
    <div id="dataTime">数据时间 --</div>
    <div id="breadth">--</div>
  </div>
</header>
<div class="toolbar">
  <div class="seg" id="segType">

  </div>
  <label><span class="lt">面积</span><select id="selArea"><option value="mcap">总市值</option><option value="amount">成交额</option><option value="flowabs">主力净流入(绝对值)</option></select></label>
  <label><span class="lt">着色</span><select id="selColor"><option value="pct">涨跌幅</option><option value="flow">主力净流入(亿)</option><option value="ratio">主力净占比</option></select></label>
  <span id="gnOpts" style="display:none;gap:10px">
    <label title="按总市值排序取前N个概念"><span class="lt">显示</span><select id="selTopN"><option value="100">前100</option><option value="200" selected>前200</option><option value="0">全部</option></select></label>
    <label class="chk" title="剔除 融资融券、沪股通、MSCI、HS300_、大盘股、机构重仓、破净股、次新股 等指数/风格/统计类概念"><input type="checkbox" id="chkFilter" checked> 过滤风格类</label>
  </span>
  <span class="spacer"></span>
  <label><span class="lt">自动刷新</span><select id="selRefresh"><option value="0">关闭</option><option value="10">10秒</option><option value="30" selected>30秒</option><option value="60">60秒</option><option value="120">2分钟</option></select></label>

</div>
<main>
  <section class="panel map">
    <div class="ptitle"><span id="mapTitle">板块云图</span><span class="hint" id="mapHint"></span><span id="legend" class="legend"></span></div>
    <div id="treemap"></div>
    <div id="selBar" class="selbar"></div>
    <div id="mapOverlay" class="overlay">正在加载东方财富行情数据…</div>
  </section>
  <section class="panel side">
    <div class="ptitle"><span id="barTitle">主力资金 净流入 / 净流出 TOP10</span><span class="hint">单位：亿元</span></div>
    <div id="bar"></div>
    <div id="summary"></div>
  </section>
</main>
<footer>
  <span>数据来源：东方财富公开行情接口（<span id="srcHost">push2.eastmoney.com</span>，JSONP）。主力净流入 = 超大单 + 大单净流入。数据仅供参考，不构成投资建议。</span>
  <span id="fetchInfo"></span>
</footer>
<div id="toast"></div>

<script>
(function(){
'use strict';
/* ================= 配置 ================= */
var HOSTS = ['https://push2.eastmoney.com', 'https://push2test.eastmoney.com']; // 第二个为东方财富备用域名
var hostParam = new URLSearchParams(location.search).get('host');
if (hostParam) { var hp = HOSTS.filter(function(h){return h.indexOf(hostParam) >= 0;}); if (hp.length) HOSTS = hp.concat(HOSTS.filter(function(h){return hp.indexOf(h) < 0;})); }
var hostIdx = 0;
var TYPES = {
  hy1: {fs: 'm:90+s:2',      label: '行业板块（一级）'},
  hy2: {fs: 'm:90+s:4',      label: '行业板块（二级）'},
  gn:  {fs: 'm:90+t:3+f:!50', label: '概念板块'},
  dy:  {fs: 'm:90+t:1+f:!50', label: '地域板块'}
};
var BOARD_FIELDS = 'f12,f13,f14,f2,f3,f6,f20,f62,f184,f66,f69,f72,f75,f78,f81,f84,f87,f104,f105,f106,f124,f128,f136,f140,f141';
var STOCK_FIELDS = 'f12,f13,f14,f2,f3,f6,f8,f20,f62,f184,f66,f72,f124';
var INDICES = [
  {secid: '1.000001', name: '上证指数'}, {secid: '0.399001', name: '深证成指'}, {secid: '0.399006', name: '创业板指'},
  {secid: '1.000300', name: '沪深300'}, {secid: '1.000688', name: '科创50'}, {secid: '0.899050', name: '北证50'}
];
var DRILL_MAX = window.innerWidth < 760 ? 150 : 300;  // 下钻最多取市值前 N 只成分股（手机 150，电脑 300）
var BAR_N = 10;
// 指数/风格/统计类概念（面积会严重重叠放大，默认过滤）
var GN_EXCLUDE_EXACT = ['融资融券','MSCI中国','沪股通','深股通','富时罗素','标准普尔','AH股','AB股','GDR','B股','权重股','机构重仓','基金重仓','QFII重仓','社保重仓','券商金股','证金持股','养老金','行业龙头','破净股','长期破净','红利破净股','破增发价股','百元股','低价股','低市净率','高市净率','周期股','红利股','价值股','趋势股','高成长股','茅指数','宁组合','次新股','注册制次新股','东方财富热股','转债标的','股权集中','超级品牌','微利股','亏损股','股权激励','增持回购','央国企改革','中特估','中字头','专精特新','深圳特区','长江三角','西部大开发','贬值受益','稀缺资源'];
var GN_EXCLUDE_RE = [/_$/, /\d+R$/, /^(上证|中证|深成|深证|创业板综|创业成份|央视|国证)/, /[大中小微]盘(股|价值|成长)?$/, /风格$/, /^昨日/, /^\d{2,4}/, /^参股/, /^ST/];
function isStyleConcept(name){ if (GN_EXCLUDE_EXACT.indexOf(name) >= 0) return true; for (var i=0;i<GN_EXCLUDE_RE.length;i++) if (GN_EXCLUDE_RE[i].test(name)) return true; return false; }

/* ================= 触屏判定 ================= */
// 最近一次指针类型：触屏点按时先显示提示，再次点按才下钻；鼠标点击保持直接下钻
var lastPointer = (window.matchMedia && matchMedia('(hover: none)').matches) ? 'touch' : 'mouse';
document.addEventListener('pointerdown', function(e){ lastPointer = e.pointerType || 'mouse'; }, true);
document.addEventListener('touchstart', function(){ lastPointer = 'touch'; }, {capture: true, passive: true});
function isTouchNow(){ return lastPointer === 'touch' || lastPointer === 'pen'; }

/* ================= 状态 ================= */
var state = { type: 'hy1', area: 'mcap', color: 'pct', topN: 200, filter: true, refreshSec: 30,
  boards: null, boardsType: null, drill: null, stocks: null, indices: null, dataDate: null, dataTs: null,
  loading: false, nextAt: 0, lastFetch: null, selected: null };

/* ================= 工具 ================= */
function $(id){ return document.getElementById(id); }
function num(v){ return (v === '-' || v === null || v === undefined || v === '' || isNaN(+v)) ? null : +v; }
function cls(v){ return v == null ? 'flat' : (v > 0 ? 'up' : (v < 0 ? 'down' : 'flat')); }
function sgn(v, d){ if (v == null) return '--'; d = d == null ? 2 : d; return (v > 0 ? '+' : '') + v.toFixed(d); }
function pctS(v){ return v == null ? '--' : sgn(v) + '%'; }
function yi(v){ return v == null ? null : v / 1e8; }
function fmtYi(v, signed){ // v 单位：元
  if (v == null) return '--';
  var a = Math.abs(v), s = signed && v > 0 ? '+' : '';
  if (a >= 1e12) return s + (v / 1e12).toFixed(2) + '万亿';
  if (a >= 1e8)  return s + (v / 1e8).toFixed(2) + '亿';
  return s + (v / 1e4).toFixed(0) + '万';
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function bjParts(date){ // 始终按北京时间计算，与用户电脑时区无关
  var f = new Intl.DateTimeFormat('en-GB', {timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'short', hour12: false});
  var o = {}; f.formatToParts(date).forEach(function(p){ o[p.type] = p.value; });
  var wd = {Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6}[o.weekday];
  var hh = +o.hour % 24;
  return {y: o.year, m: o.month, d: o.day, hh: hh, mm: +o.minute, ss: +o.second, wd: wd, ymd: o.year + o.month + o.day,
    str: o.year + '-' + o.month + '-' + o.day + ' ' + String(hh).padStart(2,'0') + ':' + o.minute + ':' + o.second,
    time: String(hh).padStart(2,'0') + ':' + o.minute + ':' + o.second};
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.style.display = 'none'; }, 6000); }

/* ================= JSONP（file:// 下可跨域） ================= */
var cbSeq = 0;
function jsonp(url, timeout){
  return new Promise(function(resolve, reject){
    var cb = '__emcb_' + Date.now().toString(36) + '_' + (cbSeq++);
    var s = document.createElement('script'), done = false;
    var timer = setTimeout(function(){ finish(new Error('请求超时')); }, timeout || 9000);
    function finish(err, data){
      if (done) return; done = true; clearTimeout(timer);
      window[cb] = function(){}; // 迟到的回调置空，避免报错
      if (s.parentNode) s.parentNode.removeChild(s);
      if (err) reject(err); else resolve(data);
    }
    window[cb] = function(d){ finish(null, d); };
    s.onerror = function(){ finish(new Error('网络错误')); };
    s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'cb=' + cb + '&_=' + Date.now();
    document.head.appendChild(s);
  });
}
function em(path, query){
  var order = [];
  for (var k = 0; k < HOSTS.length; k++) order.push((hostIdx + k) % HOSTS.length);
  var i = 0, lastErr;
  function attempt(){
    if (i >= order.length) return Promise.reject(lastErr || new Error('全部数据源不可用'));
    var h = order[i++];
    return jsonp(HOSTS[h] + path + '?' + query).then(function(d){
      if (!d || d.rc !== 0 || !d.data) throw new Error('接口返回异常');
      if (hostIdx !== h) { hostIdx = h; }
      $('srcHost').textContent = HOSTS[h].replace('https://', '');
      return d.data;
    }).catch(function(e){ lastErr = e; return attempt(); });
  }
  return attempt();
}
function clistAll(fs, fields, maxRows){
  var base = 'po=1&np=1&fltt=2&invt=2&fid=f20&fs=' + fs + '&fields=' + fields + '&pz=100&pn=';
  return em('/api/qt/clist/get', base + 1).then(function(d){
    var rows = (d.diff || []).slice(), total = d.total || rows.length;
    var limit = Math.min(total, maxRows || total), pages = Math.ceil(limit / 100), ps = [];
    for (var p = 2; p <= pages; p++) ps.push(em('/api/qt/clist/get', base + p));
    return Promise.all(ps).then(function(res){ res.forEach(function(x){ rows = rows.concat(x.diff || []); }); return {rows: rows.slice(0, limit), total: total}; });
  });

function hex2rgb(h){ h = h.replace('#',''); return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)]; }
function mix(a, b, t){ var A = hex2rgb(a), B = hex2rgb(b); return 'rgb(' + [0,1,2].map(function(i){ return Math.round(A[i] + (B[i]-A[i]) * t); }).join(',') + ')'; }
var C_FLAT = '#434956', C_UP1 = '#7d3a41', C_UP2 = '#f02f3c', C_DN1 = '#2d5f47', C_DN2 = '#0cae55';
function colorOf(v, max){
  if (v == null) return '#2f3440';
  if (v === 0) return C_FLAT;
  var t = Math.min(1, Math.abs(v) / max);
  t = Math.pow(t, 0.75);
  if (v > 0) return t < 0.12 ? mix(C_FLAT, C_UP1, t / 0.12) : mix(C_UP1, C_UP2, (t - 0.12) / 0.88);
  return t < 0.12 ? mix(C_FLAT, C_DN1, t / 0.12) : mix(C_DN1, C_DN2, (t - 0.12) / 0.88);
}
function quantileAbs(arr, q){ var a = arr.filter(function(v){return v != null;}).map(Math.abs).sort(function(x,y){return x-y;}); if (!a.length) return 1; return a[Math.min(a.length-1, Math.floor(a.length*q))] || 1; }

  if (state.color === 'ratio') return {key: 'ratio', max: isStock ? 20 : 10, unit: '%', fmt: function(v){ return (v > 0 ? '+' : '') + v + '%'; }};
  var m = quantileAbs(items.map(function(x){ return yi(x.flow); }), 0.9); m = m >= 10 ? Math.round(m) : +m.toPrecision(2);
  return {key: 'flow', max: m, unit: '亿', fmt: function(v){ return (v > 0 ? '+' : '') + v + '亿'; }};
}

  return Promise.all(jobs).then(function(){
    state.loading = false; state.lastFetch = new Date();
    $('btnRefresh').disabled = false; $('btnRefresh').textContent = '⟳ 刷新';
    $('fetchInfo').textContent = '页面刷新于 ' + bjParts(state.lastFetch).time;
    renderStatus(); scheduleNext();
  });
}
function scheduleNext(){ state.nextAt = state.refreshSec > 0 ? Date.now() + state.refreshSec * 1000 : 0; }
setInterval(function(){
  var s = renderStatus(), cd = $('countdown');
  if (state.refreshSec <= 0){ cd.textContent = '已关闭'; return; }
  if (!s.trading){ cd.textContent = '非交易时段·暂停'; return; }
  if (!state.nextAt) scheduleNext();
  var left = Math.max(0, Math.ceil((state.nextAt - Date.now()) / 1000));
  cd.textContent = state.loading ? '刷新中…' : (left + ' 秒后刷新');
  if (left <= 0 && !state.loading) refresh(false);
}, 1000);

function enterDrill(b){
  state.drill = {code: b.code, name: b.name, total: 0}; state.stocks = null; state.selected = null; renderSelBar();
  tmChart.dispatchAction({type: 'hideTip'}); barChart.dispatchAction({type: 'hideTip'});
  try { if (!(history.state && history.state.drill)) history.pushState({drill: true}, ''); } catch (e) {}
  tmChart.clear(); $('mapOverlay').style.display = 'flex'; $('mapOverlay').textContent = '正在加载「' + b.name + '」成分股…';
  $('mapTitle').textContent = b.name + ' 成分股';
  state.loading = false; refresh(true);
}
function doExitDrill(){ state.drill = null; state.stocks = null; state.selected = null; tmChart.clear(); tmChart.dispatchAction({type: 'hideTip'}); renderAll(); window.scrollTo(0, 0); }
function exitDrill(){
  if (history.state && history.state.drill){ try { history.back(); return; } catch (e) {} }
  doExitDrill();
}
window.addEventListener('popstate', function(){ if (state.drill) doExitDrill(); });

/* ================= 交互 ================= */
Array.prototype.forEach.call(document.querySelectorAll('#segType button'), function(btn){
  btn.addEventListener('click', function(){
    if (state.type === btn.dataset.v && !state.drill) return;
    Array.prototype.forEach.call(document.querySelectorAll('#segType button'), function(b){ b.classList.toggle('on', b === btn); });
    state.type = btn.dataset.v; state.drill = null; state.stocks = null; state.boards = null; state.selected = null; renderSelBar();
    try { if (history.state && history.state.drill) history.replaceState(null, ''); } catch (e) {}
    $('gnOpts').style.display = state.type === 'gn' ? 'inline-flex' : 'none';
    tmChart.clear(); barChart.clear(); $('summary').innerHTML = '';
    $('mapOverlay').style.display = 'flex'; $('mapOverlay').textContent = '正在加载' + TYPES[state.type].label + '…';
    state.loading = false; refresh(true);
  });
});
$('selArea').onchange = function(){ state.area = this.value; renderTreemap(); };
$('selColor').onchange = function(){ state.color = this.value; renderTreemap(); };
$('selTopN').onchange = function(){ state.topN = +this.value; renderAll(); };
$('chkFilter').onchange = function(){ state.filter = this.checked; renderAll(); };
$('selRefresh').onchange = function(){ state.refreshSec = +this.value; scheduleNext(); };
$('btnRefresh').onclick = function(){ refresh(true); };
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && state.drill) exitDrill(); });

refresh(true);
})();
</script>
</body>
</html>
